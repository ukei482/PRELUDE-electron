[package]
name = "prelude-cli"
version = "0.1.0"
description = "prelude コマンド(コアのソケットにつないで、状態を見る・操作する)"
edition.workspace = true

[[bin]]
name = "prelude"
path = "src/main.rs"

[dependencies]
prelude-format = { path = "../prelude-format" }
prelude-proto = { path = "../prelude-proto" }
serde_json = "1"
toml = "0.9"
libc = "0.2"
