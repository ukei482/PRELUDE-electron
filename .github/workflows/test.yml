# PR と main への push でテストを回す: npm test(Electron 版)、Rust 版のコア・コマンド(crates/)、Slint の試作の決まり(proto/slint)
name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # テストは Node の node:test だけを使い、DOM・Electron は要らない。依存(smol-toml)は要る。
      # --ignore-scripts で Electron 本体のダウンロードは省く
      - run: npm ci --ignore-scripts
      - run: npm test

  # Rust 版のコア・コマンド・形式(ルートのワークスペース)。画面も D-Bus も要らない
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Slint の試作: サイドバーの決まり(.slint の global)を破るとビルドで止まることなど。ルートのワークスペースの外
  slint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proto/slint
    steps:
      - uses: actions/checkout@v4
      # fontconfig の開発用のファイル(Slint のビルドが使う)。実行環境に入っていれば取らない。
      # パッケージの置き場に一時的に届かないことがあるので、何度かやり直す
      - run: |
          pkg-config --exists fontconfig && exit 0
          for i in 1 2 3 4; do
            sudo apt-get update && sudo apt-get install -y libfontconfig1-dev && exit 0
            sleep $((i * 15))
          done
          exit 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: proto/slint
      - run: cargo fmt --check
      - run: cargo test
