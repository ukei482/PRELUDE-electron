# PR と main への push で npm test を回す
name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # テストは Node の node:test だけを使い、DOM・Electron は要らない。依存(smol-toml)は要る。
      # --ignore-scripts で Electron 本体のダウンロードは省く
      - run: npm ci --ignore-scripts
      - run: npm test
