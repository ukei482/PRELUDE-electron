<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:">
  <title>PRELUDE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="titlebar">
    <button class="ibtn" id="tb-sidebar" title="サイドバー"></button>
    <span id="tb-title">PRELUDE</span>
    <span class="grow"></span>
    <button class="ibtn tbtn" id="tb-fullscreen" title="全画面"></button>
    <button class="ibtn tbtn" id="tb-min" title="最小化"></button>
    <button class="ibtn tbtn" id="tb-max" title="最大化"></button>
    <button class="ibtn tbtn close" id="tb-close" title="閉じる"></button>
  </header>
  <div id="main">
    <aside id="sidebar">
      <div class="sb-title">ブックマーク</div>
      <div id="bm-list"></div>
      <div class="sb-title">タブ <button class="ibtn" id="new-tab" title="新しいタブ"></button></div>
      <div id="tab-list"></div>
      <div class="sb-foot"><button class="textbtn" id="open-settings"></button></div>
    </aside>
    <section id="workspace"></section>
  </div>
  <footer id="statusbar"></footer>
  <div id="overlay"></div>
  <div id="toast"></div>
  <script src="bar.js"></script>
  <script src="launcher.js"></script>
  <script src="app.js"></script>
</body>
</html>
